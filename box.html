<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Pop-Up Gift Box</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .gift-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        /* The Box Container */
        .gift-box {
            position: relative;
            width: 150px;
            height: 150px;
            background-color: #ff4081;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        /* Vertical Ribbon */
        .gift-box::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background-color: #ffeb3b;
        }

        /* The Lid */
        .box-lid {
            position: absolute;
            top: -20px;
            left: 45px;
            width: 160px;
            height: 25px;
            background-color: #e91e63;
            border-radius: 4px;
            box-shadow: 0 4px 5px rgba(0,0,0,0.1);
            z-index: 2;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Lid Ribbon */
        .box-lid::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background-color: #ffeb3b;
        }

        /* The Surprise Gift hidden inside */
        .surprise-gift {
            position: absolute;
            top: 20px;
            font-size: 5rem;
            z-index: 1;
            opacity: 0;
            transform: scale(0.1) translateY(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            pointer-events: none;
        }

        /* --- Animations when Active/Opened --- */
        
        /* Gentle hover shake to invite clicks */
        .gift-container:hover .gift-box {
            transform: scale(1.05);
        }

        /* Lid flies off when box is opened */
        .gift-container.open .box-lid {
            transform: translateY(-80px) rotate(-15deg);
            opacity: 0.1;
        }

        /* Gift pops up boldly */
        .gift-container.open .surprise-gift {
            opacity: 1;
            transform: scale(1.5) translateY(-110px);
        }

        /* Hint Text */
        .hint {
            margin-top: 30px;
            color: #880e4f;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="gift-container" id="giftContainer">
        <!-- The Surprise Item (You can swap the emoji for an image tag!) -->
        <div class="surprise-gift" id="gift">💐</div>
        
        <!-- The Physical Box structure -->
        <div class="box-lid"></div>
        <div class="gift-box"></div>
        
        <!-- Action Label -->
        <div class="hint" id="hintText">Click to open your gift!</div>
    </div>

    <script>
        const container = document.getElementById('giftContainer');
        const hintText = document.getElementById('hintText');
        
        // Array of optional alternative gifts to cycle through on click
        const gifts = ['💐', '🌹', '🧸💜', '🌺', '🌼', '💝','🌷'];

        container.addEventListener('click', () => {
            // Toggle the open class to trigger CSS animations
            const isOpen = container.classList.toggle('open');
            
            if (isOpen) {
                hintText.textContent = "Click to close!";
            } else {
                hintText.textContent = "Click to open your gift!";
                // Cycle to a random new gift when closed so the next open is a surprise
                const randomGift = gifts[Math.floor(Math.random() * gifts.length)];
                document.getElementById('gift').textContent = randomGift;
            }
        });
    </script>
</body>
</html>
